# Stack local de Sentinel-DNS (C4).
#
# Perfiles:
#   core      Kafka, ClickHouse, Grafana, Prometheus, sentinel-api
#   security  Wazuh manager (API POST /events)
#   demo      simulador mixed_demo
#   full      core + security + demo
#
# Un comando: `docker compose --profile full up -d --build` o `make full`.
# `make up` usa el perfil core (Kafka/CH/Grafana/API) para desarrollo en host.
#
# Los nombres de servicio y puertos deben coincidir con los defaults de
# app/core/config.py y de deploy/grafana/provisioning:
#   kafka:9092       SENTINEL_KAFKA__BOOTSTRAP_SERVERS
#   clickhouse:8123  SENTINEL_CLICKHOUSE__HOST / HTTP_PORT y el datasource
#   wazuh-manager:55000  SENTINEL_WAZUH__BASE_URL
#
# Indexer y dashboard Wazuh son declarativos en Kubernetes (C5). En Compose
# el manager basta para POST /events; las reglas usan el decoder JSON.
#
# Todos los puertos publicados escuchan solo en loopback (spec seccion 5).
#
# Todos los puertos publicados escuchan solo en loopback (spec seccion 5).
#
# Grafana usa una imagen propia con el plugin de ClickHouse ya incorporado:
# la primera vez hace falta `docker compose build`, con Internet. Despues todo
# el stack arranca sin salida a Internet (spec seccion 13).

name: sentinel-dns

services:
  kafka:
    profiles: [core, full]
    image: apache/kafka:3.8.1
    container_name: sentinel-kafka
    restart: unless-stopped
    networks: [sentinel-net]
    ports:
      # Solo loopback. Listener extra para procesos que corren en el host
      # (simulador y tests) mientras no esten dentro de Compose.
      - "127.0.0.1:29092:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Los topics se crean explicitamente en kafka-init; no auto-crear.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Crea los topics y termina. Los nombres estan congelados en
  # app/constants/kafka.py: cambiarlos requiere un ADR.
  kafka-init:
    profiles: [core, full]
    image: apache/kafka:3.8.1
    container_name: sentinel-kafka-init
    restart: "no"
    networks: [sentinel-net]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        crear() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$1" --partitions "$$2" --replication-factor 1
        }
        crear dns.telemetry.normalized 3
        crear sentinel.dns.dlq 1
        crear sentinel.dns.groundtruth 1
        echo "--- topics disponibles ---"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  # Almacen de ventanas QoE. El esquema se crea solo en el primer arranque:
  # deploy/clickhouse/init/*.sql se monta en el entrypoint de inicializacion.
  clickhouse:
    profiles: [core, full]
    image: clickhouse/clickhouse-server:24.8.14.39-alpine
    container_name: sentinel-clickhouse
    restart: unless-stopped
    networks: [sentinel-net]
    ports:
      # Solo loopback: tests de integracion y procesos que corren en el host.
      - "127.0.0.1:8123:8123"
    environment:
      # Perfil local: usuario `default` sin password, alcanzable solo desde la
      # red interna y loopback. Un entorno real inyecta credenciales por secret
      # (SENTINEL_CLICKHOUSE__USERNAME_FILE / PASSWORD_FILE).
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Sano recien cuando la tabla existe: Grafana y el agente no arrancan
      # contra un esquema a medio crear.
      test:
        - CMD-SHELL
        - test "$$(clickhouse-client --query 'EXISTS TABLE sentinel_dns.dns_qoe_1m')" = "1"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  grafana:
    profiles: [core, full]
    build:
      context: .
      dockerfile: deploy/docker/grafana.Dockerfile
    image: sentinel-dns/grafana:11.2.0-ch4.14.0
    container_name: sentinel-grafana
    restart: unless-stopped
    networks: [sentinel-net]
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # La demo se ve sin iniciar sesion y abre directo en el dashboard. El
      # rol anonimo es Viewer: no permite editar nada.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/sentinel-dns.json
      # Sin telemetria ni llamadas salientes (AGENTS.md, regla 2).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/api/health | grep -q 'database.*ok'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  sentinel-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinel-dns/api:local
    container_name: sentinel-api
    restart: unless-stopped
    profiles: [core, full]
    networks: [sentinel-net]
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      SENTINEL_WAZUH__BASE_URL: https://wazuh-manager:55000
      SENTINEL_QVAC_CACHE_DIR: /app/data/qvac
      SENTINEL_OUTBOX__PATH: /app/data/outbox/sentinel.db
    volumes:
      - ./data/qvac:/app/data/qvac:ro
      - sentinel-outbox-data:/app/data/outbox
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health/live >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.7
    container_name: sentinel-wazuh
    hostname: wazuh-manager
    restart: unless-stopped
    profiles: [security, full]
    networks: [sentinel-net]
    ports:
      - "127.0.0.1:55000:55000"
    volumes:
      - wazuh-data:/var/ossec/data
      - ./deploy/wazuh/rules/sentinel_dns_rules.xml:/var/ossec/etc/rules/sentinel_dns_rules.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://127.0.0.1:55000 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sentinel-prometheus
    restart: unless-stopped
    profiles: [core, full]
    networks: [sentinel-net]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  simulator:
    image: sentinel-dns/api:local
    container_name: sentinel-simulator
    restart: "no"
    profiles: [demo, full]
    networks: [sentinel-net]
    depends_on:
      kafka:
        condition: service_healthy
      sentinel-api:
        condition: service_healthy
    # Sin --duration: mixed_demo usa sus 480 s por defecto, 60 s por escenario.
    # Con menos, cada escenario dura muy poco y beaconing no llega a juntar las
    # 8 consultas que exige config/features.yaml: la demo no lo detectaria.
    command: ["uv", "run", "python", "-m", "simulator.main", "--scenario", "mixed_demo", "--bootstrap", "kafka:9092", "--rate", "5"]

networks:
  sentinel-net:
    name: sentinel-net
    driver: bridge

volumes:
  kafka-data:
    name: sentinel-kafka-data
  clickhouse-data:
    name: sentinel-clickhouse-data
  grafana-data:
    name: sentinel-grafana-data
  wazuh-data:
    name: sentinel-wazuh-data
  prometheus-data:
    name: sentinel-prometheus-data
  sentinel-outbox-data:
    name: sentinel-outbox-data
