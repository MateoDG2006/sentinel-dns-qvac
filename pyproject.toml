[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-dns"
version = "0.1.0"
description = "Local DNS threat detection and QoE scoring with QVAC, Kafka, Wazuh, and ClickHouse."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "aiokafka>=0.12.0",
    "httpx>=0.27.0",
    "clickhouse-connect>=0.8.0",
    "aiosqlite>=0.20.0",
    "prometheus-client>=0.21.0",
    "PyYAML>=6.0.2",
    "rapidfuzz>=3.10.0",
    "numpy>=2.0.0",
    "tetherto-qvac-sdk>=0.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "testcontainers>=4.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "simulator"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "simulator", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "simulator"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]
packages = ["app", "simulator"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
