    metadata:
      labels:
        app.kubernetes.io/name: wazuh-dashboard
    spec:
      containers:
        - name: wazuh-dashboard
          image: wazuh/wazuh-dashboard:4.14.7
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
          ports:
            - name: https
              containerPort: 5601
          env:
            - name: INDEXER_URL
              value: https://wazuh-indexer:9200
            - name: INDEXER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sentinel-credentials
                  key: wazuh_indexer_username
                  optional: true
            - name: INDEXER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinel-credentials
                  key: wazuh_indexer_password
                  optional: true
            - name: WAZUH_API_URL
              value: https://wazuh-manager:55000
          # Initial values for the local overlay.
          resources:
            requests:
