# Initial PVC sizes for the local overlay. Operators should replace these
# with institutional storage in a real cluster (ADR-010).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  labels:
    app.kubernetes.io/name: kafka
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 8Gi
---
